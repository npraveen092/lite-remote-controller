services:
  signaling:
    build:
      context: ..
      dockerfile: deploy/signaling.Dockerfile
    restart: unless-stopped
    environment:
      SIGNALING_ADDR: ":8080"
    expose:
      - "8080"
    networks:
      - lrc

  turn:
    image: coturn/coturn:4.6
    restart: unless-stopped
    command:
      - "-n"
      - "--log-file=stdout"
      - "--lt-cred-mech"
      - "--realm=${TURN_REALM}"
      - "--user=${TURN_USERNAME}:${TURN_PASSWORD}"
      - "--fingerprint"
      - "--no-multicast-peers"
      - "--no-cli"
      - "--listening-port=3478"
      - "--min-port=${TURN_MIN_PORT:-49160}"
      - "--max-port=${TURN_MAX_PORT:-49260}"
    environment:
      TURN_REALM: ${TURN_REALM}
      TURN_USERNAME: ${TURN_USERNAME}
      TURN_PASSWORD: ${TURN_PASSWORD}
    ports:
      - "3478:3478/tcp"
      - "3478:3478/udp"
      - "${TURN_MIN_PORT:-49160}-${TURN_MAX_PORT:-49260}:${TURN_MIN_PORT:-49160}-${TURN_MAX_PORT:-49260}/udp"
    networks:
      - lrc

  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - signaling
    networks:
      - lrc

networks:
  lrc:

volumes:
  caddy_data:
  caddy_config:
